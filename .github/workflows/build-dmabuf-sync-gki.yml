name: Build GKI dma-buf sync

on:
  push:
    branches:
      - test/dmabuf-sync-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmabuf-sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev libncurses5 libtinfo5 rsync kmod curl git python3 \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross cmake pkg-config \
            libdw-dev zlib1g-dev
      - name: Build and audit module
        env:
          SHENG_SYNC_ARTIFACT_DIR: ${{ runner.temp }}/sheng-dmabuf-sync-artifacts
        run: bash tools/build_dmabuf_sync_gki.sh "$GITHUB_WORKSPACE"
      # 仅归档公开内核构建产物和验证记录
      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sheng-dmabuf-sync-gki-${{ github.sha }}
          path: ${{ runner.temp }}/sheng-dmabuf-sync-artifacts
          if-no-files-found: warn
          retention-days: 7
